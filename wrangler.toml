name = "qiuzhao-tracker"
main = "src/worker.ts"
compatibility_date = "2024-10-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "qiuzhao-tracker-db"
database_id = "<your-database-id>"

[vars]
ENVIRONMENT = "production"