<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9f8f4"/>
      <stop offset="60%" stop-color="#f5f3ec"/>
      <stop offset="100%" stop-color="#efe8df"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c55333"/>
      <stop offset="100%" stop-color="#df7a58"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#302719" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e4e3da" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)" opacity="0.65"/>
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#dcdcd2" stroke-width="1.5"/>

  <!-- Top Editorial Metadata Bar -->
  <line x1="56" y1="54" x2="1144" y2="54" stroke="#d8dad0" stroke-width="1"/>
  <text x="56" y="40" font-family="Consolas, 'SF Mono', monospace" font-size="11" fill="#7d8076" letter-spacing="2">01 / PERSONAL CAREER WORKSPACE &amp; INTERVIEW INTELLIGENCE</text>
  <text x="1144" y="40" text-anchor="end" font-family="Consolas, 'SF Mono', monospace" font-size="11" fill="#c55333" letter-spacing="1.5">CLOUDFLARE WORKERS · HONO · D1 · WORKERS AI</text>

  <!-- Left Column: Brand & Headline -->
  <g transform="translate(56, 86)">
    <!-- Brand Mark -->
    <circle cx="28" cy="28" r="28" fill="#c55333"/>
    <text x="28" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#fffefa">↗</text>

    <text x="72" y="25" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="700" fill="#202820" letter-spacing="2">投递</text>
    <text x="72" y="44" font-family="Consolas, monospace" font-size="10" font-weight="600" fill="#808376" letter-spacing="2.5">CAREER WORKSPACE</text>

    <!-- Main Title -->
    <text x="0" y="114" font-family="Georgia, 'Songti SC', 'Noto Serif SC', 'PingFang SC', serif" font-size="44" font-weight="700" fill="#1e2420" letter-spacing="-0.5">
      每一步求职进展，<tspan fill="#c55333">都算数。</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="154" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="16" fill="#525a50">
      把公司、岗位、投递时间线与 AI 面试复盘放在同一间编辑室里。
    </text>
    <text x="0" y="180" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#777e72">
      表格直填自动保存 · 阶段与约面解耦 · 同义岗位归并 · 跨场次考点智能提炼
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="132" height="32" rx="16" fill="#f6e6dc" stroke="#dfb9a7"/>
      <text x="66" y="21" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#7d301c">✦ AI 复盘总览</text>

      <rect x="144" y="0" width="136" height="32" rx="16" fill="#fffefa" stroke="#d4d7ca"/>
      <text x="212" y="21" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2c332b">◷ 独立约面时间线</text>

      <rect x="292" y="0" width="136" height="32" rx="16" fill="#fffefa" stroke="#d4d7ca"/>
      <text x="360" y="21" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2c332b">⇄ 云端与离线双模</text>

      <rect x="440" y="0" width="128" height="32" rx="16" fill="#fffefa" stroke="#d4d7ca"/>
      <text x="504" y="21" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2c332b">🔒 Zero Trust</text>
    </g>
  </g>

  <!-- Right Column: Floating Editorial UI Preview Card -->
  <g transform="translate(700, 78)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="444" height="252" rx="10" fill="#fffefa" stroke="#dcded3" stroke-width="1"/>
    <!-- Card Top Header -->
    <rect x="0" y="0" width="444" height="38" rx="10" fill="#f3f2eb"/>
    <circle cx="18" cy="19" r="4.5" fill="#d97757"/>
    <circle cx="32" cy="19" r="4.5" fill="#d6b665"/>
    <circle cx="46" cy="19" r="4.5" fill="#829b72"/>
    <text x="70" y="23" font-family="'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#5d6458">投递工作台  /  面试复盘</text>
    <circle cx="368" cy="19" r="3.5" fill="#6a9674"/>
    <text x="378" y="23" font-family="'PingFang SC', sans-serif" font-size="10" fill="#687060">已同步云端</text>

    <!-- Mini Stats Strip -->
    <g transform="translate(20, 52)">
      <text x="0" y="12" font-family="'PingFang SC', sans-serif" font-size="10" fill="#737a69">全部投递</text>
      <text x="0" y="40" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#c55333">18</text>
      <line x1="92" y1="2" x2="92" y2="44" stroke="#e4e5dc"/>

      <text x="110" y="12" font-family="'PingFang SC', sans-serif" font-size="10" fill="#737a69">进行中</text>
      <text x="110" y="40" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#282c26">06</text>
      <line x1="202" y1="2" x2="202" y2="44" stroke="#e4e5dc"/>

      <text x="220" y="12" font-family="'PingFang SC', sans-serif" font-size="10" fill="#737a69">收获 Offer</text>
      <text x="220" y="40" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#647b47">03</text>
      <line x1="312" y1="2" x2="312" y2="44" stroke="#e4e5dc"/>

      <text x="330" y="12" font-family="'PingFang SC', sans-serif" font-size="10" fill="#737a69">面试复盘</text>
      <text x="330" y="40" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#282c26">12</text>
    </g>

    <line x1="20" y1="106" x2="424" y2="106" stroke="#e8e9e0"/>

    <!-- Mini AI Overview Banner -->
    <rect x="20" y="118" width="404" height="44" rx="4" fill="#fcf6f0"/>
    <rect x="20" y="118" width="3" height="44" rx="1.5" fill="#c55333"/>
    <text x="32" y="136" font-family="'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#7d301c">✦ AI 全局总览：</text>
    <text x="116" y="136" font-family="'PingFang SC', sans-serif" font-size="11" fill="#282c26">一面高频深挖「项目与底层细节」「Pipeline 组件通信」</text>
    <text x="32" y="153" font-family="'PingFang SC', sans-serif" font-size="11" fill="#5a6258">建议优先梳理多源数据管线（规划 / Ego / 动捕）与技术路线对比。</text>

    <!-- Hotword Chips -->
    <g transform="translate(20, 174)">
      <rect x="0" y="0" width="92" height="24" rx="12" fill="#c55333"/>
      <text x="46" y="16" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="10" font-weight="600" fill="#ffffff">全部考点 12</text>

      <rect x="100" y="0" width="118" height="24" rx="12" fill="#fdf6f1" stroke="#dfb9a7"/>
      <text x="159" y="16" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="10" fill="#2c332b">项目与底层细节 5</text>

      <rect x="226" y="0" width="124" height="24" rx="12" fill="#fdf6f1" stroke="#dfb9a7"/>
      <text x="288" y="16" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="10" fill="#2c332b">Pipeline 组件通信 4</text>
    </g>

    <!-- Mini Row Item -->
    <g transform="translate(20, 210)">
      <rect x="0" y="0" width="404" height="28" rx="4" fill="#f7f6f0"/>
      <text x="10" y="18" font-family="'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#202820">★ 星河机器人</text>
      <rect x="96" y="6" width="62" height="16" rx="3" fill="#eef0e8"/>
      <text x="127" y="17" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="9" fill="#647056">具身智能算法</text>
      <rect x="166" y="5" width="42" height="18" rx="3" fill="#f8efd9" stroke="#e8d8ad"/>
      <text x="187" y="17" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="10" fill="#9f7d37">二面</text>
      <text x="220" y="18" font-family="'PingFang SC', sans-serif" font-size="10" fill="#687060">10/19 14:00 · 已安排</text>
      <text x="392" y="18" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="10" fill="#c55333">历史 ⌄</text>
    </g>
  </g>
</svg>
