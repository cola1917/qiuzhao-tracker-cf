<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投递管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f6f7f9; --surface:#ffffff; --surface-2:#fbfcfd;
  --ink:#171b23; --ink-2:#404961; --muted:#6b7486; --faint:#9aa2b2;
  --line:#e3e6ec; --line-2:#eef0f4;
  --accent:#2f4a7d; --accent-soft:#e8eef8; --accent-rail:#3f5f9e;
  --warm:#b0703a;
  --chip:#e2eaf7; --chip-ink:#2f4a7d;
  --st-none:#8a93a5;  --st-none-bg:#eef0f3;
  --st-sent:#3f6fb4;  --st-sent-bg:#e6eefa;
  --st-assess:#2f7f83; --st-assess-bg:#e2f1f1;
  --st-test:#7a5bb5;  --st-test-bg:#eee9f8;
  --st-i1:#b5822a;    --st-i1-bg:#f8f0dd;
  --st-i2:#c07030;    --st-i2-bg:#fbeade;
  --st-i3:#b0512e;    --st-i3-bg:#fae3da;
  --st-oc:#2f8659;    --st-oc-bg:#e2f2e9;
  --st-out:#a04a4a;   --st-out-bg:#f7e6e6;
  --danger:#b3453f;
  --shadow:0 1px 2px rgba(20,26,40,.05), 0 8px 24px -12px rgba(20,26,40,.18);
  --radius:9px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ground:#12151b; --surface:#191d25; --surface-2:#1d222b;
    --ink:#e6e9ef; --ink-2:#c2c9d6; --muted:#98a1b3; --faint:#6f7889;
    --line:#2a303b; --line-2:#232833;
    --accent:#7ea3dd; --accent-soft:#1e2839; --accent-rail:#5c86cc;
    --warm:#cf9155;
    --chip:#22304a; --chip-ink:#a8c3ec;
    --st-none:#98a1b3; --st-none-bg:#252a34;
    --st-sent:#7ba5e0; --st-sent-bg:#1c2839;
    --st-assess:#61b4b8; --st-assess-bg:#173033;
    --st-test:#ab8ddf; --st-test-bg:#262038;
    --st-i1:#dcae56;  --st-i1-bg:#302819;
    --st-i2:#e0965c;  --st-i2-bg:#33251a;
    --st-i3:#dd7f5e;  --st-i3-bg:#341f19;
    --st-oc:#5cbb8b;  --st-oc-bg:#173026;
    --st-out:#d4787c; --st-out-bg:#33201f;
    --danger:#df8080;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#12151b; --surface:#191d25; --surface-2:#1d222b;
  --ink:#e6e9ef; --ink-2:#c2c9d6; --muted:#98a1b3; --faint:#6f7889;
  --line:#2a303b; --line-2:#232833;
  --accent:#7ea3dd; --accent-soft:#1e2839; --accent-rail:#5c86cc;
  --warm:#cf9155;
  --chip:#22304a; --chip-ink:#a8c3ec;
  --st-none:#98a1b3; --st-none-bg:#252a34;
  --st-sent:#7ba5e0; --st-sent-bg:#1c2839;
  --st-assess:#61b4b8; --st-assess-bg:#173033;
  --st-test:#ab8ddf; --st-test-bg:#262038;
  --st-i1:#dcae56;  --st-i1-bg:#302819;
  --st-i2:#e0965c;  --st-i2-bg:#33251a;
  --st-i3:#dd7f5e;  --st-i3-bg:#341f19;
  --st-oc:#5cbb8b;  --st-oc-bg:#173026;
  --st-out:#d4787c; --st-out-bg:#33201f;
  --danger:#df8080;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  /* Windows 上 IBM Plex 若没联网加载成功，退到 Segoe UI + 微软雅黑，观感不塌 */
  font-family:"IBM Plex Sans","Segoe UI",system-ui,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",Consolas,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1300px;margin:0 auto;padding:26px 22px 72px}

/* ---------- 页头 ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px;margin-bottom:18px}
.head h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.head h1::before{content:"";width:4px;height:22px;border-radius:2px;background:var(--accent-rail)}
.head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.saveflag{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.saveflag .dot{width:7px;height:7px;border-radius:50%;background:var(--st-oc);flex:none}
.saveflag[data-s="saving"] .dot{background:var(--st-i1)}
.saveflag[data-s="error"] .dot{background:var(--danger)}
.saveflag[data-s="local"] .dot{background:var(--warm)}

/* ---------- 统计条 ---------- */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;
}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-size:21px;font-weight:600;line-height:1.15;font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.stat.alarm{background:var(--st-out-bg)}
.stat.alarm b{color:var(--st-out)}
.stat.alarm span{color:var(--st-out)}

/* ---------- 工具条 ---------- */
.bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.field{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:0 9px;height:33px}
.field:focus-within{border-color:var(--accent)}
.field input,.field select{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);outline:none;padding:0;height:31px}
.field input{width:170px}
.field svg{flex:none;color:var(--faint)}
.btn{
  font:inherit;font-size:13px;font-weight:500;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:7px;height:33px;padding:0 13px;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn:focus-visible,.field:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.spacer{margin-left:auto}

/* ---------- 表 ---------- */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1000px}
thead th{
  position:sticky;top:0;z-index:3;background:var(--surface-2);
  font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);
  text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody tr{border-bottom:1px solid var(--line-2)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td{padding:5px 7px;vertical-align:middle}
/* 左侧色轨 = 当前状态，竖着一扫就知道整条管线的分布 */
td.co{border-left:3px solid var(--rail);width:230px;min-width:230px;padding:9px 10px}
td.dl{width:132px}
td.roles{width:238px;min-width:238px}
td.dept{width:148px}
td.when{width:126px}
td.status{width:104px}
td.note{min-width:210px}
td.act{width:38px;text-align:center}

.cell{
  font:inherit;font-size:13px;color:var(--ink);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:5px 7px;width:100%;min-height:30px;
}
.cell::placeholder{color:var(--faint)}
.cell:hover{border-color:var(--line);background:var(--surface)}
.cell:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent-soft)}
.coname{font-weight:600;font-size:14px}
.colink{font-size:12px;color:var(--muted);margin-top:2px}

.dlrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dlrow input{
  font-family:"IBM Plex Mono",Consolas,monospace;font-size:12px;color:var(--ink-2);
  background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 5px;width:118px;
}
.dlrow input:hover{border-color:var(--line);background:var(--surface)}
.dlrow input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
input[type="date"].is-empty:not(:focus){color:transparent}
input[type="date"].is-empty:not(:focus)::-webkit-datetime-edit{color:transparent}
input[type="date"].is-empty:not(:focus):hover{color:var(--faint)}
.pill{
  font-family:"IBM Plex Mono",Consolas,monospace;font-size:10.5px;font-weight:500;
  padding:1.5px 6px;border-radius:4px;white-space:nowrap;background:var(--st-none-bg);color:var(--st-none);
}
.pill.warn{background:var(--st-i1-bg);color:var(--st-i1)}
.pill.hot{background:var(--st-out-bg);color:var(--st-out)}
.pill.gone{background:var(--st-none-bg);color:var(--faint);text-decoration:line-through}

.rolebox{
  display:flex;flex-wrap:wrap;gap:4px;align-items:center;width:100%;
  border:1px solid transparent;border-radius:5px;padding:4px 6px;min-height:30px;
  cursor:pointer;text-align:left;background:transparent;font:inherit;
}
.rolebox:hover{border-color:var(--line);background:var(--surface)}
.rolebox:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rolebox .ph{color:var(--faint);font-size:13px}
.rchip{font-size:11.5px;padding:1.5px 7px;border-radius:4px;background:var(--chip);color:var(--chip-ink);white-space:nowrap}

.statuspick{
  font:inherit;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid transparent;border-radius:20px;padding:4px 9px;
  appearance:none;-webkit-appearance:none;text-align:center;
  background:var(--bg);color:var(--fg);width:100%;
}
.statuspick:focus{outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.statuspick option{background:var(--surface);color:var(--ink);font-weight:400}

.del{border:0;background:transparent;color:var(--faint);cursor:pointer;padding:5px;border-radius:5px;line-height:0}
.del:hover{color:var(--danger);background:var(--st-out-bg)}

.empty{padding:64px 24px;text-align:center;color:var(--muted)}
.empty h2{margin:0 0 7px;font-size:16px;font-weight:600;color:var(--ink)}
.empty p{margin:0 auto 18px;max-width:38em;font-size:13.5px;line-height:1.65}

.pop{
  position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);width:264px;padding:9px;
  max-height:min(60vh,380px);display:flex;flex-direction:column;gap:8px;
}
.pop[hidden]{display:none}
.poplist{overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin:-2px}
.poplist label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:5px;font-size:13px;cursor:pointer}
.poplist label:hover{background:var(--surface-2)}
.poplist input{accent-color:var(--accent);margin:0;flex:none}
.poplist .rm{margin-left:auto;border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:0 3px;visibility:hidden}
.poplist label:hover .rm{visibility:visible}
.poplist .rm:hover{color:var(--danger)}
.popadd{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.popadd input{flex:1;font:inherit;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--ink)}
.popadd input:focus{outline:none;border-color:var(--accent)}
.popadd button{font:inherit;font-size:13px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:0 11px;cursor:pointer}

.foot{margin-top:16px;font-size:12px;color:var(--faint);line-height:1.7}
.foot b{color:var(--muted);font-weight:500}
.notice{background:var(--st-i1-bg);color:var(--st-i1);border-radius:7px;padding:8px 12px;font-size:12.5px;margin-bottom:14px}
.notice[hidden]{display:none}

@media (max-width:640px){
  .wrap{padding:18px 12px 56px}
  .head h1{font-size:20px}
  .field input{width:130px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>投递管理</h1>
    </div>
    <div class="saveflag" id="saveflag" data-s="ok"><span class="dot"></span><span id="savetext">就绪</span></div>
  </div>

  <div class="notice" id="notice" hidden></div>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <label class="field">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="q" type="search" placeholder="搜公司 / 部门 / 备注" autocomplete="off">
    </label>
    <label class="field">
      <span style="font-size:12px;color:var(--muted)">状态</span>
      <select id="statusfilter"></select>
    </label>
    <label class="field">
      <span style="font-size:12px;color:var(--muted)">排序</span>
      <select id="sort">
        <option value="deadline">按截止日期</option>
        <option value="added">按添加顺序</option>
        <option value="name">按公司名</option>
        <option value="status">按状态进度</option>
      </select>
    </label>
    <div class="spacer"></div>
    <button class="btn" id="expcsv" title="导出 CSV，可用 Excel / 腾讯文档打开">导出 CSV</button>
    <button class="btn" id="expjson" title="导出全部数据，换电脑或备份用">备份</button>
    <button class="btn" id="impjson" title="从备份文件恢复">恢复</button>
    <input type="file" id="fileinput" accept=".json,application/json" hidden>
    <button class="btn primary" id="add" data-act="add">＋ 新增公司</button>
  </div>

  <div class="tablewrap" id="tablewrap"></div>

  <div class="foot">
    <b>怎么用：</b>点任意格子直接改，自动保存 · 「投递岗位」可多选，列表里没有的在弹层底部自己加 ·
    截止日期旁自动算剩余天数，7 天内变黄、3 天内变红、过期划线 · 每行左侧色条 = 当前状态，竖着扫一眼就知道管线分布 ·
    换电脑或想留档就点「备份」存下 JSON，新机器上「恢复」即可。
  </div>
</div>

<div class="pop" id="pop" hidden>
  <div class="poplist" id="poplist"></div>
  <div class="popadd">
    <input id="newrole" type="text" placeholder="添加新岗位…" autocomplete="off">
    <button id="addrole" type="button">加入</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STATUSES = [
    {v:"未投", k:"none"}, {v:"已投", k:"sent"}, {v:"测评", k:"assess"},
    {v:"笔试", k:"test"},
    {v:"一面", k:"i1"}, {v:"二面", k:"i2"}, {v:"三面", k:"i3"},
    {v:"OC",  k:"oc"},  {v:"已挂", k:"out"}
  ];
  var SKEY = {}, SORDER = {};
  STATUSES.forEach(function(s,i){ SKEY[s.v] = s.k; SORDER[s.v] = i; });
  var LIVE = ["测评","笔试","一面","二面","三面"];

  var DEFAULT_ROLES = [
    "具身智能算法","机器人算法","VLA / 多模态算法","机器人仿真","Sim2Real",
    "感知算法","SLAM / 定位","运动规划","运动控制","强化学习",
    "大模型算法","AI Infra","端侧部署","机械工程师","结构工程师","软件开发"
  ];

  var LS_KEY = "qiuzhao-tracker-v2";
  var state = { v:2, roles: DEFAULT_ROLES.slice(), companies: [] };
  var mode = "local";          // "server" = 存到 Cloudflare D1；"local" = 存到浏览器
  var saveTimer = null, dirty = false;
  var ui = { q:"", status:"", sort:"deadline" };
  var rolesLoaded = false;

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function uid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function todayISO(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,"0"); };
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
  }
  function daysLeft(iso){
    if(!iso) return null;
    var a = new Date(iso + "T00:00:00"), b = new Date(todayISO() + "T00:00:00");
    if(isNaN(a)) return null;
    return Math.round((a - b) / 86400000);
  }
  function dlPill(iso){
    var n = daysLeft(iso);
    if(n === null) return "";
    if(n < 0) return '<span class="pill gone">已截止</span>';
    if(n === 0) return '<span class="pill hot">今天截止</span>';
    var cls = n <= 3 ? "hot" : (n <= 7 ? "warn" : "");
    return '<span class="pill ' + cls + '">剩 ' + n + ' 天</span>';
  }

  function blank(){
    return { id: uid(), name:"", link:"", deadline:"", roles:[], dept:"",
             appliedAt:"", status:"未投", note:"" };
  }

  function matches(co){
    if(ui.q){
      var hay = [co.name, co.link, co.dept, co.note].concat(co.roles).join(" ").toLowerCase();
      if(hay.indexOf(ui.q.toLowerCase()) < 0) return false;
    }
    if(ui.status && co.status !== ui.status) return false;
    return true;
  }
  function sorted(){
    var list = state.companies.filter(matches);
    if(ui.sort === "name"){
      list.sort(function(a,b){ return (a.name||"").localeCompare(b.name||"","zh"); });
    } else if(ui.sort === "deadline"){
      list.sort(function(a,b){
        var x = a.deadline || "9999-99-99", y = b.deadline || "9999-99-99";
        return x < y ? -1 : x > y ? 1 : 0;
      });
    } else if(ui.sort === "status"){
      list.sort(function(a,b){ return (SORDER[b.status]||0) - (SORDER[a.status]||0); });
    }
    return list;
  }

  // ---------- 渲染 ----------
  function renderStats(){
    var n = {all:0, todo:0, sent:0, live:0, oc:0, soon:0};
    state.companies.forEach(function(co){
      n.all++;
      var s = co.status;
      if(s === "未投"){
        n.todo++;
        var d = daysLeft(co.deadline);
        if(d !== null && d >= 0 && d <= 7) n.soon++;
      } else {
        n.sent++;
        if(s === "OC") n.oc++;
        if(LIVE.indexOf(s) >= 0) n.live++;
      }
    });
    $("stats").innerHTML =
      tile(n.all, "记录公司") + tile(n.todo, "待投") + tile(n.sent, "已投") +
      tile(n.live, "面试中", "var(--st-i2)") + tile(n.oc, "OC", "var(--st-oc)") +
      '<div class="stat' + (n.soon ? " alarm" : "") + '"><b>' + n.soon + '</b><span>7 天内截止待投</span></div>';
  }
  function tile(v, label, color){
    return '<div class="stat"><b' + (color ? ' style="color:' + color + '"' : "") + '>' + v + '</b><span>' + label + '</span></div>';
  }

  function rolesCell(co){
    var inner = co.roles.length
      ? co.roles.map(function(x){ return '<span class="rchip">' + esc(x) + '</span>'; }).join("")
      : '<span class="ph">选择岗位…</span>';
    return '<button type="button" class="rolebox" data-act="roles" data-c="' + co.id + '">' + inner + '</button>';
  }
  function statusCell(co){
    var k = SKEY[co.status] || "none";
    return '<select class="statuspick" data-act="status" data-c="' + co.id + '" ' +
      'style="--bg:var(--st-' + k + '-bg);--fg:var(--st-' + k + ')" aria-label="投递状态">' +
      STATUSES.map(function(s){
        return '<option value="' + s.v + '"' + (s.v === co.status ? " selected" : "") + '>' + s.v + '</option>';
      }).join("") + '</select>';
  }

  function row(co){
    var k = SKEY[co.status] || "none";
    return '<tr style="--rail:var(--st-' + k + ')">' +
      '<td class="co">' +
        '<input class="cell coname" data-act="f" data-f="name" data-c="' + co.id + '" value="' + esc(co.name) + '" placeholder="公司名">' +
        '<input class="cell colink" data-act="f" data-f="link" data-c="' + co.id + '" value="' + esc(co.link) + '" placeholder="投递链接 / 来源">' +
      '</td>' +
      '<td class="dl"><div class="dlrow">' +
        '<input type="date" class="' + (co.deadline ? "" : "is-empty") + '" data-act="f" data-f="deadline" data-c="' + co.id + '" value="' + esc(co.deadline) + '" aria-label="投递截止日期">' +
        dlPill(co.deadline) + '</div></td>' +
      '<td class="roles">' + rolesCell(co) + '</td>' +
      '<td class="dept"><input class="cell" data-act="f" data-f="dept" data-c="' + co.id + '" value="' + esc(co.dept) + '" placeholder="部门 / 团队"></td>' +
      '<td class="when"><input class="cell' + (co.appliedAt ? "" : " is-empty") + '" type="date" data-act="f" data-f="appliedAt" data-c="' + co.id + '" value="' + esc(co.appliedAt) + '" aria-label="投递时间"></td>' +
      '<td class="status">' + statusCell(co) + '</td>' +
      '<td class="note"><input class="cell" data-act="f" data-f="note" data-c="' + co.id + '" value="' + esc(co.note) + '" placeholder="备注：内推码、笔试时间、面试反馈…"></td>' +
      '<td class="act"><button class="del" data-act="del" data-c="' + co.id + '" title="删除" aria-label="删除这家公司">' +
        '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg></button></td>' +
      '</tr>';
  }

  function renderTable(){
    var wrap = $("tablewrap");
    if(!state.companies.length){
      wrap.innerHTML = '<div class="empty"><h2>还没有记录</h2>' +
        '<p>看到一家想投的公司就点右上角「新增公司」，填公司名和截止日期，' +
        '之后随进度改状态即可。数据存在本机，只有你自己看得到。</p>' +
        '<button class="btn primary" data-act="add">＋ 添加第一家公司</button></div>';
      return;
    }
    var list = sorted();
    if(!list.length){
      wrap.innerHTML = '<div class="empty"><h2>没有匹配的公司</h2><p>换个关键词，或把筛选条件放宽一点。</p></div>';
      return;
    }
    wrap.innerHTML = '<table><thead><tr>' +
      '<th>公司 / 链接</th><th>截止日期</th><th>投递岗位</th><th>部门</th>' +
      '<th>投递时间</th><th>状态</th><th>备注</th><th></th></tr></thead><tbody>' +
      list.map(row).join("") + '</tbody></table>';
  }
  function render(){ renderStats(); renderTable(); }

  // ---------- 保存 ----------
  function flag(s, t){ $("saveflag").dataset.s = s; $("savetext").textContent = t; }
  function scheduleSave(){
    dirty = true;
    flag("saving","保存中…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 700);
  }
  function stamp(){
    return new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
  }
  function saveLocal(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      return true;
    }catch(e){ return false; }
  }
  function doSave(){
    if(!dirty) return;
    dirty = false;
    if(mode === "server"){
      fetch("api/data", {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ v: 2, roles: state.roles, companies: state.companies })
      }).then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        saveLocal();
        flag("ok","已保存 " + stamp());
      }).catch(function(err){
        dirty = true;
        flag("error","写入失败（" + err.message + "），已存到浏览器，稍后重试");
        saveLocal();
        clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 4000);
      });
    } else {
      if(saveLocal()) flag("local","已存到浏览器 " + stamp());
      else flag("error","浏览器存储写不进去，请点「备份」手动存一份");
    }
  }

  function addRoleServer(role){
    if(mode !== "server") return Promise.resolve();
    return fetch("api/roles", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ name: role })
    }).then(function(r){ return r.json(); });
  }

  function deleteRoleServer(role){
    if(mode !== "server") return Promise.resolve();
    return fetch("api/roles/" + encodeURIComponent(role), {
      method: "DELETE"
    }).then(function(r){ return r.json(); });
  }

  // ---------- 岗位弹层 ----------
  var popCtx = null;
  function openPop(btn){
    popCtx = { c: btn.dataset.c, btn: btn };
    drawPop();
    var pop = $("pop"), r = btn.getBoundingClientRect();
    pop.hidden = false;
    var top = r.bottom + 6, h = pop.offsetHeight;
    if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    pop.style.top = top + "px";
    pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 10)) + "px";
    $("newrole").value = "";
  }
  function closePop(){ $("pop").hidden = true; popCtx = null; }
  function coOf(id){ return state.companies.find(function(x){ return x.id === id; }); }
  function drawPop(){
    if(!popCtx) return;
    var co = coOf(popCtx.c);
    if(!co) return closePop();
    $("poplist").innerHTML = state.roles.map(function(role,i){
      return '<label><input type="checkbox" data-role="' + esc(role) + '"' +
        (co.roles.indexOf(role) >= 0 ? " checked" : "") + '><span>' + esc(role) + '</span>' +
        '<button type="button" class="rm" data-rm="' + i + '" title="从列表移除">×</button></label>';
    }).join("");
  }
  function refreshRolesCell(){
    if(!popCtx) return;
    var co = coOf(popCtx.c);
    if(!co) return;
    popCtx.btn.innerHTML = co.roles.length
      ? co.roles.map(function(x){ return '<span class="rchip">' + esc(x) + '</span>'; }).join("")
      : '<span class="ph">选择岗位…</span>';
  }

  // ---------- 事件 ----------
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-act]");
    if(t){
      var act = t.dataset.act;
      if(act === "add"){ addCompany(); return; }
      if(act === "del"){ delCompany(t.dataset.c); return; }
      if(act === "roles"){ e.preventDefault(); openPop(t); return; }
    }
    if(!$("pop").hidden && !e.target.closest("#pop") && !e.target.closest('[data-act="roles"]')) closePop();
  });

  $("pop").addEventListener("change", function(e){
    if(!e.target.matches("input[data-role]") || !popCtx) return;
    var co = coOf(popCtx.c);
    if(!co) return;
    var role = e.target.dataset.role, i = co.roles.indexOf(role);
    if(e.target.checked){ if(i < 0) co.roles.push(role); }
    else if(i >= 0) co.roles.splice(i,1);
    refreshRolesCell(); scheduleSave();
  });

  $("pop").addEventListener("click", function(e){
    var rm = e.target.closest("[data-rm]");
    if(!rm) return;
    var role = state.roles[+rm.dataset.rm];
    state.roles.splice(+rm.dataset.rm, 1);
    state.companies.forEach(function(co){
      var i = co.roles.indexOf(role);
      if(i >= 0) co.roles.splice(i,1);
    });
    drawPop(); render(); scheduleSave();
    deleteRoleServer(role);
  });

  $("addrole").addEventListener("click", addRole);
  $("newrole").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); addRole(); }
  });
  function addRole(){
    var v = $("newrole").value.trim();
    if(!v) return;
    if(state.roles.indexOf(v) < 0) state.roles.push(v);
    var co = popCtx && coOf(popCtx.c);
    if(co && co.roles.indexOf(v) < 0) co.roles.push(v);
    $("newrole").value = "";
    drawPop(); refreshRolesCell(); scheduleSave();
    addRoleServer(v);
  }
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !$("pop").hidden) closePop();
  });

  document.addEventListener("input", function(e){
    var t = e.target.closest('[data-act="f"]');
    if(!t) return;
    var co = coOf(t.dataset.c);
    if(!co) return;
    co[t.dataset.f] = t.value;
    if(t.type === "date") t.classList.toggle("is-empty", !t.value);
    if(t.dataset.f === "deadline"){
      var old = t.parentNode.querySelector(".pill");
      if(old) old.remove();
      t.insertAdjacentHTML("afterend", dlPill(t.value));
      renderStats();
    }
    scheduleSave();
  });

  document.addEventListener("change", function(e){
    var t = e.target.closest('[data-act="status"]');
    if(!t) return;
    var co = coOf(t.dataset.c);
    if(!co) return;
    co.status = t.value;
    // 状态一旦推进，投递时间基本就是今天 —— 顺手填上
    if(t.value !== "未投" && !co.appliedAt){
      co.appliedAt = todayISO();
      var di = document.querySelector('[data-f="appliedAt"][data-c="' + co.id + '"]');
      if(di){ di.value = co.appliedAt; di.classList.remove("is-empty"); }
    }
    var k = SKEY[t.value] || "none";
    t.style.setProperty("--bg","var(--st-" + k + "-bg)");
    t.style.setProperty("--fg","var(--st-" + k + ")");
    var tr = t.closest("tr");
    if(tr) tr.style.setProperty("--rail","var(--st-" + k + ")");
    renderStats(); scheduleSave();
  });

  function addCompany(){
    var co = blank();
    state.companies.unshift(co);
    ui.sort = "added"; $("sort").value = "added";
    render();
    var el = document.querySelector('[data-f="name"][data-c="' + co.id + '"]');
    if(el){ el.focus(); el.scrollIntoView({block:"center", behavior:"smooth"}); }
    scheduleSave();
  }
  function delCompany(id){
    var co = coOf(id);
    if(!confirm("删除 " + (co && co.name ? "「" + co.name + "」" : "这一条") + "？不能撤销。")) return;
    state.companies = state.companies.filter(function(x){ return x.id !== id; });
    render(); scheduleSave();
  }

  // ---------- 筛选 ----------
  $("q").addEventListener("input", function(){ ui.q = this.value.trim(); renderTable(); });
  $("sort").addEventListener("change", function(){ ui.sort = this.value; renderTable(); });
  (function(){
    var sel = $("statusfilter");
    sel.innerHTML = '<option value="">全部</option>' + STATUSES.map(function(s){
      return '<option value="' + s.v + '">' + s.v + '</option>';
    }).join("");
    sel.addEventListener("change", function(){ ui.status = this.value; renderTable(); });
  })();

  // ---------- 导出 / 备份 / 恢复 ----------
  function download(name, text, mime){
    var blob = new Blob([text], {type: mime + ";charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  $("expcsv").addEventListener("click", function(){
    var head = ["公司名称","截止日期","剩余天数","投递岗位","投递部门","投递时间","投递状态","备注","投递链接"];
    var q = function(s){ return '"' + String(s == null ? "" : s).replace(/"/g,'""') + '"'; };
    var lines = [head.map(q).join(",")];
    sorted().forEach(function(co){
      var d = daysLeft(co.deadline);
      lines.push([co.name, co.deadline, d === null ? "" : d, co.roles.join("、"),
                  co.dept, co.appliedAt, co.status, co.note, co.link].map(q).join(","));
    });
    // BOM：不加的话 Excel 打开中文是乱码
    download("秋招投递-" + todayISO() + ".csv", "﻿" + lines.join("\r\n"), "text/csv");
  });
  $("expjson").addEventListener("click", function(){
    download("秋招投递备份-" + todayISO() + ".json", JSON.stringify(state, null, 2), "application/json");
  });
  $("impjson").addEventListener("click", function(){ $("fileinput").click(); });
  $("fileinput").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      var incoming;
      try{ incoming = JSON.parse(String(reader.result)); }
      catch(e){ alert("这个文件读不出来，不是有效的备份 JSON。"); return; }
      if(!incoming || !Array.isArray(incoming.companies)){
        alert("文件格式对不上，缺少 companies 列表。"); return;
      }
      if(state.companies.length &&
         !confirm("当前有 " + state.companies.length + " 条记录，恢复会全部替换成备份里的 " +
                  incoming.companies.length + " 条。继续？")) return;
      state = {
        v: 2,
        roles: Array.isArray(incoming.roles) && incoming.roles.length ? incoming.roles : DEFAULT_ROLES.slice(),
        companies: incoming.companies
      };
      normalize();
      render(); scheduleSave();
    };
    reader.readAsText(f, "utf-8");
    this.value = "";
  });

  // 补齐缺字段，容忍手改过或旧版本的备份文件
  function normalize(){
    if(!Array.isArray(state.roles) || !state.roles.length) state.roles = DEFAULT_ROLES.slice();
    if(!Array.isArray(state.companies)) state.companies = [];
    state.companies.forEach(function(co){
      if(!co.id) co.id = uid();
      if(!Array.isArray(co.roles)) co.roles = [];
      ["name","link","deadline","dept","appliedAt","note"].forEach(function(f){
        if(typeof co[f] !== "string") co[f] = "";
      });
      if(!SKEY[co.status]) co.status = "未投";
    });
  }

  // ---------- 启动 ----------
  function boot(loaded, m, note){
    if(loaded) state = loaded;
    normalize();
    mode = m;
    if(note){ $("notice").textContent = note; $("notice").hidden = false; }
    render();
    flag(m === "server" ? "ok" : "local", m === "server" ? "就绪 · 存到 Cloudflare D1" : "就绪 · 存在浏览器");
  }

  function readLocal(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function fetchRolesAndBoot(data, m, note){
    if(m === "server" && !rolesLoaded){
      rolesLoaded = true;
      fetch("api/roles").then(function(r){
        if(r.ok) return r.json();
        throw new Error("HTTP " + r.status);
      }).then(function(d){
        if(d && Array.isArray(d.roles) && d.roles.length){
          state.roles = d.roles;
        }
        boot(data, m, note);
      }).catch(function(){
        boot(data, m, note);
      });
    } else {
      boot(data, m, note);
    }
  }

  if(location.protocol === "http:" || location.protocol === "https:"){
    fetch("api/data").then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(d){
      var local = readLocal();
      if((!d || !d.companies || !d.companies.length) && local && local.companies && local.companies.length){
        fetchRolesAndBoot(local, "server", "已把浏览器里原有的 " + local.companies.length + " 条记录接过来，接下来都存到 Cloudflare D1。");
        dirty = true; doSave();
        return;
      }
      fetchRolesAndBoot(d && d.companies ? d : null, "server");
    }).catch(function(){
      boot(readLocal(), "local",
        "没连上后端服务，数据先存在这个浏览器里。部署到 Cloudflare Workers 后可实现多端同步。");
    });
  } else {
    boot(readLocal(), "local",
      "你是直接双击打开的，数据存在这个浏览器里 —— 换浏览器或清缓存会丢。建议部署到 Cloudflare Workers 实现多端同步。");
  }

  window.addEventListener("beforeunload", function(e){
    if(dirty){ clearTimeout(saveTimer); doSave(); }
  });
})();
</script>
</body>
</html>
